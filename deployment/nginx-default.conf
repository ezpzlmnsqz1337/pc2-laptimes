server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA entry + service worker: never cache, so deploys reach clients.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Content-hashed build assets (app.<hash>.js/css, index-<hash>.*): immutable for a year.
    location ~* "[.-][0-9a-f]{8}\.[a-z]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
